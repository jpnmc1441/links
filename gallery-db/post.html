<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{site}</title>
  <meta name="theme-color" content="#0c0c0d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script type="module" src="assets/post.js"></script>
</head>
<body>
  <main>
    <article class="post" id="post">
      <a class="back" href="./">← All posts</a>

      <!-- Section 1: media -->
      <section class="media" id="media" aria-label="Images">
        <div class="stage skeleton"></div>
      </section>

      <!-- Section 2: title & description -->
      <section class="details" id="details" aria-label="Details">
        <div class="skeleton" style="height:48px;width:60%;margin-bottom:16px"></div>
        <div class="skeleton" style="height:16px;width:90%;margin-bottom:8px"></div>
        <div class="skeleton" style="height:16px;width:75%"></div>
      </section>

      <!-- Section 3: comments -->
      <section class="comments" id="comments" aria-label="Comments"></section>
    </article>
  </main>
  <footer class="site-footer"><div class="wrap" id="footer"></div></footer>
</body>
</html>
